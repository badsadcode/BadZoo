<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#1d1a26}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { generateAnimal } from '/src/core/animal.ts';
import { presetRecipe } from '/src/core/species.ts';
import { exportGlb } from '/src/export/gltf.ts';
const q = new URLSearchParams(location.search);
const species = (q.get('s') ?? 'dog').split(',');
const clip = q.get('clip'); const ct = Number(q.get('t') ?? 0);
const views = (q.get('v') ?? 'side,front34,back34,front').split(',');
const W = 520, H = 400;
const cols = Number(q.get('cols') ?? views.length);
const rows = Math.ceil(views.length * species.length / cols);
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setSize(W * cols, H * rows); r.setScissorTest(true);
r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2536);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xe8e4ff, 0x3a2f45, 1.0));
const sun = new THREE.DirectionalLight(0xfff0e0, 2.4); sun.position.set(2.5, 5, 3.5); scene.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x3a3448 })); g.rotation.x = -Math.PI/2; scene.add(g);
const loader = new GLTFLoader();
let i = 0;
const jobs = [];
for (const sp of species) {
  const [name0, ...mods] = sp.split('~');
  const [name, seed] = name0.split(':');
  const rc = presetRecipe(name, Number(seed ?? 1));
  // ~head.muzzleShape=blunt~head.muzzleLength=0.2 : per-animal overrides
  for (const m of mods) { const [k, v] = m.split('='); const ks = k.split('.'); let o = rc; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = isNaN(Number(v)) ? v : Number(v); }
  if (q.get('shading')) rc.mesh.shading = q.get('shading');
  if (q.get('tris')) rc.mesh.tris = Number(q.get('tris'));
  if (q.get('topo')) rc.mesh.topology = q.get('topo');
  const an = generateAnimal(rc);
  const bytes = exportGlb(an);
  const gltf = await new Promise((res, rej) => loader.parse(bytes.buffer, '', res, rej));
  const root = gltf.scene; scene.add(root);
  root.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (q.get('wire')) o.material.wireframe = true; } });
  if (clip) { const m = new THREE.AnimationMixer(root); const c = gltf.animations.find(a => a.name === clip) ?? gltf.animations[0]; m.clipAction(c).play(); m.setTime(ct * c.duration); }
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
  const d = Math.max(sz.x, sz.y, sz.z) * 2.1;
  for (const v of views) {
    const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
    const dirs = { side: [1, 0.15, 0], front34: [0.8, 0.35, 0.9], back34: [-0.7, 0.45, -0.8], front: [0, 0.2, 1], top: [0.01, 1, 0], head: [0.6, 0.25, 1], under: [0.5,-0.6,0.3] };
    const dv = new THREE.Vector3(...dirs[v]).normalize();
    let target = c.clone(), dist = d;
    if (v === 'head') { target = new THREE.Vector3(...an.anatomy.dims.headTip).lerp(new THREE.Vector3(...an.anatomy.bones[an.anatomy.index.Head].world), 0.6); dist = d * 0.35; }
    cam.position.copy(target).addScaledVector(dv, dist); cam.lookAt(target);
    const col = i % cols, row = Math.floor(i / cols);
    const y = (rows - 1 - row) * H;
    r.setViewport(col * W, y, W, H); r.setScissor(col * W, y, W, H);
    jobs.push({ root, cam, col, y });
    i++;
  }
  console.log(JSON.stringify({ species: name, ...an.stats }));
}
await new Promise((res) => setTimeout(res, 800));
for (const j of jobs) {
  scene.children.forEach(o => { if (o.isGroup || o.type === 'Group' || o.type === 'Object3D') o.visible = o === j.root; });
  r.setViewport(j.col * W, j.y, W, H); r.setScissor(j.col * W, j.y, W, H);
  r.render(scene, j.cam);
}
document.title = 'done';
</script></body></html>
