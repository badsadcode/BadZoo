<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BadZoo</title>
    <meta name="description" content="BadZoo: procedural low-poly, sculpted, skinned, rigged and animated animals by Bad Ideas Works." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231b1726'/><polygon points='14,40 22,18 30,30 46,26 54,40 46,50 20,50' fill='%23ffb35c'/><polygon points='22,18 26,8 30,30' fill='%237c5cff'/><circle cx='42' cy='34' r='3' fill='%231b1726'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">BAD<b>ZOO</b></span>
          <span class="tag">Bad Ideas Works · sculpted low-poly animals, monsters and mounts</span>
        </div>
        <div class="actions">
          <a class="btn" href="./devlog.html" title="The intake journal of the BadZoo Sanctuary">📓 Devlog</a>
          <button id="btn-random" class="btn accent" title="Random species, proportions and coat (R)">🎲 Surprise me</button>
          <button id="btn-share" class="btn" title="Copy a link to this exact animal">🔗 Share</button>
          <button id="btn-save" class="btn" title="Save the editable recipe (.badzoo.json)">💾 Save</button>
          <label class="btn" title="Load a .badzoo.json recipe">📂 Load<input id="file-load" type="file" accept=".json" hidden /></label>
          <button id="btn-export" class="btn accent" title="Skinned, rigged, animated GLB">📦 Export GLB</button>
        </div>
      </header>

      <aside class="panel left" id="left">
        <section>
          <h2>Species</h2>
          <div class="seg cats" id="cats"></div>
          <div class="chips species" id="species"></div>
        </section>
        <section>
          <h2>Basics</h2>
          <div class="row"><label>Name</label><input id="in-name" type="text" /><span></span></div>
          <div class="row"><label>Sex</label><div class="seg sex" id="in-sex"><button data-sex="male">♂ Male</button><button data-sex="female">♀ Female</button></div><span></span></div>
          <div class="row"><label>Seed</label><input id="in-seed" type="number" /><button class="mini" id="btn-seed" title="New individual of this species">🎲</button></div>
          <div class="row"><label>Hybrid</label><select id="in-hybrid"></select><span></span></div>
          <div class="row"><label>Blend</label><input id="in-blend" type="range" min="0" max="1" step="0.05" value="0" /><output id="out-blend">0%</output></div>
          <p class="hint">Pick a second species and slide to cross-breed. Bad ideas encouraged.</p>
        </section>
        <div id="controls"></div>
      </aside>

      <main class="viewport" id="viewport">
        <canvas id="canvas"></canvas>
        <div class="hud top">
          <div class="seg" id="clips"></div>
          <div class="seg" id="toggles">
            <button data-t="skeleton" title="Show bones">🦴 Bones</button>
            <button data-t="wire" title="Wireframe">🕸 Wire</button>
            <button data-t="turn" class="on" title="Turntable">🔄 Spin</button>
          </div>
        </div>
        <div class="busy" id="busy">sculpting…</div>
        <div class="hud bottom" id="stats"></div>
        <div class="toast" id="toast"></div>
      </main>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
